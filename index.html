<!DOCTYPE html>
<html lang="en">
<head>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg: #0b0b0c;
  --fg: #eaeaea;
  --muted: #8a8a8a;
  --accent: #ffffff;
}

html, body {
  height: 100%;
  background-color: var(--bg);
  background-repeat: repeat;
  color: var(--fg);
  font-family: 'Inter', sans-serif;
  overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
    linear-gradient(to right, rgba(99, 99, 99, 0.1) 2px, transparent 2px),
    linear-gradient(to bottom, rgba(99, 99, 99, .1) 2px, transparent 2px);
    background-size: 200px 200px;
    z-index: 0;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image: url("https://grainy-gradients.vercel.app/noise.svg");
  background-size: 40%;
  opacity: 0.15;
  z-index: 999;
}

header {
  padding: 4rem 4vw 5rem;
}

header h1 {
  font-weight: 400;
  font-size: clamp(2.5rem, 5vw, 4rem);
  letter-spacing: -0.03em;
}

header p {
  margin-top: 1rem;
  max-width: 420px;
  color: var(--muted);
  font-size: 0.95rem;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 4vw;
  padding: 0 4vw 4rem;
}

.art {
  position: relative;
  cursor: pointer;
  overflow: hidden;
}

.art img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: grayscale(100%) contrast(1.1);
  transition: transform 0.8s ease, filter 0.8s ease;
  position: relative;
  overflow: hidden;
  z-index: 0;
}

.art:hover img {
  transform: scale(1.05);
  filter: grayscale(0%);
}

.art::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0) 0%,
    rgba(0,0,0,0.45) 50%,
    rgba(0,0,0,0.85) 100%
  );
  opacity: 0;
  transition: opacity 0.6s ease;
  z-index: 1;
  pointer-events: none;
}

.art:hover::before {
  opacity: 1;
}

.art span {
  position: absolute;
  bottom: -2rem;
  left: 1rem;
  font-size: 2rem;
  color: var(--muted);
  transition: bottom 0.6s ease;
  filter: invert(100%);
  z-index: 2;
}

.art:hover span {
  bottom: 1rem;
}

.art.large { grid-column: span 7; aspect-ratio: 16 / 10; }
.art.medium { grid-column: span 4; aspect-ratio: 4 / 5; }
.art.small { grid-column: span 4; aspect-ratio: 1 / 1; }

input[type="checkbox"] {
  display: none;
}

.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(10,10,10,0.95);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s ease;
  z-index: 100;
}

.lightbox img {
  max-width: 90vw;
  max-height: 90vh;
  object-fit: contain;
  animation: zoomIn 0.8s ease forwards;
}

input:checked + .lightbox {
  opacity: 1;
  pointer-events: auto;
}

.lightbox::after {
  content: "✕ Close";
  position: absolute;
  top: 3rem;
  right: 4rem;
  font-size: 0.75rem;
  color: var(--muted);
  letter-spacing: 0.15em;
}

@keyframes zoomIn {
  from {
    transform: scale(0.95);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

footer {
  padding: 4rem 8vw;
  font-size: 0.75rem;
  color: var(--muted);
}

@media (max-width: 768px) {

  .gallery {
    grid-template-columns: 1fr!important;
    gap: 3rem;
    padding: 0 6vw 6rem;
  }

  .art,
  .art.large,
  .art.medium,
  .art.small {
    grid-column: span 1!important;
    /* aspect-ratio: 4 / 5; */
  }

  header {
    padding: 4rem 6vw 3rem;
  }

  header h1 {
    font-size: 2.2rem;
  }

}

</style>
</head>
